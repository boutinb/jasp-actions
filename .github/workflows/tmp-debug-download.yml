name: TEMP profile lockfile tests
on:
  push:
    branches: [tmpDebugWinDownload]
jobs:
  profile:
    strategy:
      fail-fast: false
      matrix:
        packages: [lockfile, latest]
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6
        with:
          repository: jasp-stats/jaspDescriptives
      - name: Set up the test environment
        uses: boutinb/jasp-actions/setup-r-test-env@rUniverseCheckbox
        with:
          packages: ${{ matrix.packages }}
      - name: Profile one slow test file
        run: |
          library(jaspTools); library(testthat)
          jaspTools:::setPkgOption("module.dirs", getwd())
          f <- "tests/testthat/test-time-descriptives-ordering.R"
          # a short slice: the first ~10 runAnalysis calls are enough to see where time goes
          Rprof("prof.out", interval = 0.02, line.profiling = FALSE)
          t <- system.time(try(testthat::test_file(f, reporter = "summary", stop_on_failure = FALSE)))
          Rprof(NULL)
          print(t)
          s <- summaryRprof("prof.out")
          cat("\n== by.total (top 40)\n"); print(head(s$by.total, 40))
          cat("\n== by.self (top 25)\n"); print(head(s$by.self, 25))
        shell: Rscript {0}
        timeout-minutes: 60
