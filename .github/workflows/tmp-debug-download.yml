name: TEMP debug download on Windows
on:
  push:
    branches: [tmpDebugWinDownload]
jobs:
  debug:
    runs-on: windows-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6
        with:
          repository: jasp-stats/jaspDescriptives
      - name: Set up the test environment (development)
        uses: boutinb/jasp-actions/setup-r-test-env@rUniverseCheckbox
        with:
          packages: lockfile
      - name: Release check in the module's renv project
        run: |
          cat("method option:", format(getOption("download.file.method")), "| timeout:", getOption("timeout"),
              "| download.file is base:", identical(utils::download.file, get("download.file", envir = asNamespace("utils"))), "\n")
          print(Sys.getenv(c("R_LIBCURL_SSL_REVOKE_BEST_EFFORT", "CURL_CA_BUNDLE", "http_proxy", "https_proxy")))
          url <- "https://github.com/jasp-stats/jaspSyntax/releases/download/v0.99.0.2/SHA256SUMS"
          f <- tempfile()
          print(system.time(r <- try(utils::download.file(url, destfile = f, quiet = FALSE, mode = "wb"))))
          print(r); print(file.exists(f))
          print(system.time(print(jaspTools:::jaspSyntaxReleaseExists("v0.99.0.2"))))
          print(packageVersion("jaspTools")); print(utils::packageDescription("jaspTools")$RemoteSha)
          print(body(jaspTools:::jaspSyntaxReleaseExists))
        shell: Rscript {0}
